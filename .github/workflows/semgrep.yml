name: Semgrep Security Scan

on:
  pull_request:
    branches:
      - main

  push:
    branches:
      - main

jobs:
  semgrep:
    name: Semgrep SAST
    runs-on: ubuntu-latest

    permissions:
      contents: read
      security-events: write

    steps:
      - name: Checkout repository
        uses: actions/checkout@v4

      - name: Run Semgrep
        uses: semgrep/semgrep-action@v1
        with:
          config: p/owasp-top-ten