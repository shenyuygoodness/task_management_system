{% extends "base.html" %}
{% block content %}
<h1>Task #{{ task["id"] }}</h1>
<p><strong>Owner ID:</strong> {{ task["user_id"] }}</p>
<p><strong>Title:</strong> {{ task["title"] }}</p>
<p><strong>Description:</strong> {{ task["description"] }}</p>
<a href="{{ url_for('tasks') }}">Back</a>
{% endblock %}
